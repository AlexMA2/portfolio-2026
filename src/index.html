<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Alex Mamani | Senior Full Stack Developer</title>
    <meta
      name="description"
      content="Alex Mamani - Senior Full Stack &amp; Front End Engineer specializing in Angular, React, and robust cloud services."
    />
    <link rel="canonical" href="https://alexmamani.com/" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/css/flag-icons.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function() {
        var theme = localStorage.getItem('theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
    <style>
      #app-splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 999999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background-color: #ffffff;
        transition: opacity 0.6s cubic-bezier(0.25, 1, 0.5, 1), visibility 0.6s cubic-bezier(0.25, 1, 0.5, 1);
      }
      
      html.dark #app-splash-screen {
        background-color: #0f172a;
      }

      .splash-spinner {
        width: 60px;
        height: 60px;
        border: 4px solid rgba(0, 0, 0, 0.1);
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: splash-spin 1s linear infinite;
      }

      html.dark .splash-spinner {
        border: 4px solid rgba(255, 255, 255, 0.1);
        border-top-color: #60a5fa;
      }

      @keyframes splash-spin {
        to { transform: rotate(360deg); }
      }
      
      .splash-hidden {
        opacity: 0;
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <div id="app-splash-screen">
      <div class="splash-spinner"></div>
    </div>
    <app-root></app-root>
  </body>
</html>
