<div class="portfolio-app">
  <!-- Nav Header -->
  <app-header></app-header>

  <main class="portfolio-main">
    <!-- Hero / About Section -->
    <section id="about" class="portfolio-hero animate-fade-in">
      <div class="portfolio-hero__container">
        <div class="portfolio-hero__badge">{{ 'hero.badge' | transloco }}</div>
        <h1 class="portfolio-hero__title">
          {{ 'hero.title_1' | transloco }} <br>
          <span class="portfolio-hero__title--gradient">{{ 'hero.title_2' | transloco }}</span>
        </h1>
        <p class="portfolio-hero__subtitle">
          {{ 'hero.subtitle' | transloco }}
        </p>
        <p class="portfolio-hero__description">
          {{ 'hero.desc' | transloco }}
        </p>
        <div class="portfolio-hero__cta-group">
          <a href="#contact" class="portfolio-hero__btn portfolio-hero__btn--primary">{{ 'hero.cta_contact' | transloco }}</a>
          <a href="#projects" class="portfolio-hero__btn portfolio-hero__btn--secondary">{{ 'hero.cta_projects' | transloco }}</a>
        </div>
      </div>
    </section>

    <!-- Skill Tree -->
    <app-skills></app-skills>

    <!-- Professional Timeline -->
    <app-timeline></app-timeline>

    <!-- Projects Section -->
    <app-projects></app-projects>

    <!-- Contact & Footer -->
    <app-contact></app-contact>
  </main>
</div>
